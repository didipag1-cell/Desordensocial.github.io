<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>??? — Desorden Social</title>

    <link
        rel="stylesheet"
        href="entrevistas.css"
    >

    <link rel="stylesheet" href="bee-pollen.css">

</head>


<body class="entrevistas-page">


    <!-- ==========================================
         VOLVER
    =========================================== -->

    <a
        href="index.html"
        class="back-arrow"
        aria-label="Volver"
    >
        ←
    </a>



    <main>


       <section
    class="interviews-scroll"
    id="interviewsScroll"
>

    <div class="interviews-sticky">


        <!-- textura -->

        <div class="bg-noise"></div>

        <div class="bg-halftone"></div>



        <!-- marca casi invisible -->

        <div
            class="ghost ghost-1"
            aria-hidden="true"
        >
            DESORDEN SOCIAL
        </div>


        <div
            class="ghost ghost-2"
            aria-hidden="true"
        >
            DESORDEN SOCIAL
        </div>



        <!-- ======================================
             CARA / DATAMOSH
        ======================================= -->

        <div
            class="face-wrap"
            id="faceWrap"
        >

            <!-- FUENTE PARA EL DATAMOSH
                 DE ESCRITORIO / ANDROID -->

            <img
                id="faceSource"
                class="face-source"
                src="assets/entrevistas/face.svg"
                alt=""
            >


            <!-- ESCRITORIO / ANDROID -->

            <canvas
                id="faceCanvas"
                aria-hidden="true"
            ></canvas>


            <!-- iPHONE / iPAD -->

            <div
                class="ios-face-fallback"
                id="iosFaceFallback"
                aria-hidden="true"
            >

                <img
                    src="assets/entrevistas/face.svg"
                    class="ios-face-base-static"
                    alt=""
                >

                <img
                    src="assets/entrevistas/face.svg"
                    class="ios-face-layer ios-face-layer-1"
                    alt=""
                >

                <img
                    src="assets/entrevistas/face.svg"
                    class="ios-face-layer ios-face-layer-2"
                    alt=""
                >

                <img
                    src="assets/entrevistas/face.svg"
                    class="ios-face-layer ios-face-layer-3"
                    alt=""
                >

                <img
                    src="assets/entrevistas/face.svg"
                    class="ios-face-layer ios-face-layer-4"
                    alt=""
                >

            </div>

        </div>



        <!-- ======================================
             TEXTO — SIEMPRE DELANTE
        ======================================= -->

        <div
            class="talk"
            id="talkBlock"
        >

            <h1>
                let’s talk<br>
                to each other
            </h1>

        </div>


    </div>

</section>


        <!-- ==========================================
             02 — CONVERSACIÓN
        =========================================== -->

        <section class="conversation-section">


            <!-- fondo fantasma -->

            <div
                class="conversation-ghost"
                aria-hidden="true"
            >
                desorden social
            </div>



            <!-- mensajes -->

            <div
                class="conversation-stream"
                id="conversationStream"
                aria-live="polite"
            ></div>



            <!-- ======================================
                 ESCRIBIR
            ======================================= -->

            <form
    class="conversation-form"
    id="conversationForm"
    autocomplete="off"
>

    <div class="form-message-row">

        <textarea
            id="chatMessage"
            class="chat-message"
            maxlength="500"
            rows="1"
            placeholder="di algo..."
            aria-label="Mensaje"
            required
        ></textarea>

        <button
            class="chat-send"
            type="submit"
            aria-label="Enviar mensaje"
        >
            ↵
        </button>

    </div>

    <input
        class="website-field"
        id="websiteField"
        type="text"
        tabindex="-1"
        autocomplete="off"
        aria-hidden="true"
    >

</form>


        </section>


    </main>



    <!-- ==========================================
         CURSOR
    =========================================== -->

    <div
        class="site-cursor"
        id="siteCursor"
        aria-hidden="true"
    >

        <img
            src="assets/cursor/cursor.svg"
            alt=""
        >

    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="user-session.js"></script>

<script src="bee-pollen.js"></script>

<script src="entrevistas.js"></script>

</body>

</html>
